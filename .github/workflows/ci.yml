name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            target: lmvalkey-linux-x64
          - os: ubuntu-22.04-arm
            name: linux-arm64
            target: lmvalkey-linux-arm64
          - os: macos-14
            name: macos-arm64
            target: lmvalkey-macos-arm64
          - os: macos-13
            name: macos-x64
            target: lmvalkey-macos-x64
          - os: windows-2022
            name: windows-x64
            target: lmvalkey-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config tcl tclx

      - name: Setup macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config tcl-tk

      - name: Setup MSYS2 for Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel
            gcc
            make

      - name: Build Valkey (Linux)
        if: runner.os == 'Linux'
        run: |
          make -j$(nproc) lmvalkey valkey

      - name: Build Valkey (macOS)
        if: runner.os == 'macOS'
        run: |
          make -j$(sysctl -n hw.ncpu) lmvalkey valkey

      - name: Run Tests (POSIX)
        if: runner.os != 'Windows'
        run: |
          ./runtest --single unit/rest
          ./runtest --single unit/quit

      - name: Build Valkey (Windows MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        continue-on-error: true
        run: |
          make -j4 BUILD_TLS=no lmvalkey valkey || make -j4 BUILD_TLS=no

      - name: Package binary (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp src/lmvalkey "dist/${{ matrix.target }}"
          chmod +x "dist/${{ matrix.target }}"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p dist
          if [ -f src/lmvalkey.exe ]; then
            cp src/lmvalkey.exe "dist/${{ matrix.target }}"
          elif [ -f src/valkey.exe ]; then
            cp src/valkey.exe "dist/${{ matrix.target }}"
          elif [ -f src/valkey-server.exe ]; then
            cp src/valkey-server.exe "dist/${{ matrix.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: warn

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum lmvalkey-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          IS_PRERELEASE=false
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAG="latest"
            IS_PRERELEASE=true
          fi

          if [[ "$TAG" == "latest" ]] && gh release view "latest" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "latest" -R "$GITHUB_REPOSITORY" -y || true
            git push --delete origin latest 2>/dev/null || true
          fi

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Uploading assets to existing release $TAG..."
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            echo "Creating new release $TAG..."
            OPTS=()
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              OPTS+=(--prerelease --title "lmvalkey latest (rolling)")
            else
              OPTS+=(--title "lmvalkey ${TAG#v}")
            fi
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${OPTS[@]}" --generate-notes dist/*
          fi
